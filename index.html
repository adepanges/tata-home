<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denah Rumah Bertumbuh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f4f3ef; --panel: #fff; --ink: #222; --muted: #777; --line: #e2e0da; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 16px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  h1 { font-size: 20px; margin: 0; }
  .ctrl { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  input[type=range] { width: 140px; }
  main { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; padding: 0 16px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  #svg2d { width: 100%; height: auto; display: block; font-family: Inter, system-ui, sans-serif; }
  #view3d { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: #dfe9f1; }
  .label3d { font-size: 11px; background: rgba(255,255,255,.88); padding: 1px 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.future td { color: var(--muted); }
  .tools { display: flex; gap: 8px; align-items: center; }
  .seg button, .btn { border: 1px solid var(--line); background: #fff; padding: 3px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn { border-radius: 6px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button + button { border-left: 0; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .full { grid-column: 1 / -1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
  .hint label { display: flex; gap: 5px; align-items: center; }
  .shortcut { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; font-size: 12px; align-items: center; }
  .chip-grup { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .chip-grup b { color: var(--muted); font-weight: 600; margin-right: 2px; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; font: inherit; cursor: pointer; }
  .chip:hover { border-color: #999; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tog { display: flex; gap: 5px; align-items: center; font-size: 13px; font-weight: 400; cursor: pointer; }
  .legend.struktur span::before { border-radius: 2px; height: 4px; width: 16px; vertical-align: 3px; }
  .legend.struktur span.kotak::before { height: 10px; width: 10px; vertical-align: -1px; }
  .peringatan { background: #fff6e0; border: 1px solid #f0d58a; border-radius: 8px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px 20px; }
  .grid2 h3, #struktur h3 { font-size: 14px; margin: 14px 0 6px; }
  .sw { display: inline-block; width: 16px; height: 4px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
  .kode { display: inline-block; min-width: 26px; text-align: center; color: #fff; border-radius: 10px; font-size: 11px; font-weight: 700; padding: 1px 4px; }
  #struktur ul { margin: 4px 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  details summary { cursor: pointer; font-size: 13px; font-weight: 600; margin-top: 12px; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>Denah Rumah Bertumbuh</h1>
  <label class="ctrl">Tahap
    <input id="tahap" type="range" min="0" max="3" step="1" value="1">
    <b id="tahapLbl"></b>
  </label>
  <label class="ctrl"><input id="ghost" type="checkbox" checked> Tampilkan rencana tahap berikutnya</label>
</header>

<main>
  <section class="card">
    <h2>Denah 2D
      <span class="tools">
        <span class="seg" id="lantaiSeg"><button data-lantai="0" title="Denah pondasi & sloof">Pondasi</button><button data-lantai="1" class="on">Lantai 1</button><button data-lantai="2">Lantai 2</button><button data-lantai="3">Rooftop</button></span>
        <label class="tog"><input id="struktur2d" type="checkbox"> Struktur</label>
        <button class="btn" id="unduhSvg" title="Unduh denah sebagai SVG">⤓ SVG</button>
      </span>
    </h2>
    <svg id="svg2d"></svg>
    <div class="legend" id="legend"></div>
    <div class="legend struktur" id="legendStruktur" hidden></div>
  </section>

  <section class="card">
    <h2>Model 3D</h2>
    <div id="view3d"></div>
    <div class="hint">
      <span>Drag: putar · scroll: zoom · klik kanan + drag: geser</span>
      <label><input id="tanpaAtap" type="checkbox"> Sembunyikan atap</label>
      <label><input id="warnaTahap" type="checkbox" checked> Warna dinding per tahap</label>
      <label><input id="struktur3d" type="checkbox"> Struktur (dinding transparan: bata merah / hebel)</label>
    </div>
    <div class="legend struktur" id="legendStruktur3d" hidden></div>
    <div class="shortcut" id="shortcut"></div>
  </section>

  <section class="card full">
    <h2>Ringkasan per Tahap</h2>
    <table id="ringkasan"></table>
  </section>

  <section class="card full" id="struktur">
    <h2>Struktur Kolom &amp; Balok — perkiraan awal</h2>
    <div id="strukturIsi"></div>
  </section>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
