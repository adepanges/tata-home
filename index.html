<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denah Rumah Bertumbuh</title>
<style>
  :root {
    --bg: #f6f4ef; --panel: #fff; --ink: #222; --muted: #777; --line: #ddd;
    --t1: #f4b860; --t2: #6fb3d9; --t3: #86c77a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
  h1 { font-size: 20px; margin: 0; }
  .ctrl { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  input[type=range] { width: 160px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 16px 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
  .card h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #svg2d { width: 100%; height: auto; display: block; }
  #view3d { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: #dfe9f1; }
  .label3d { font-size: 11px; background: rgba(255,255,255,.85); padding: 1px 5px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; background: var(--c); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; }
  tr.future td { color: var(--muted); }
  .seg button { border: 1px solid var(--line); background: #fff; padding: 3px 10px; font-size: 13px; cursor: pointer; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .full { grid-column: 1 / -1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Denah Rumah Bertumbuh</h1>
  <label class="ctrl">Tahap
    <input id="tahap" type="range" min="1" max="3" step="1" value="1">
    <b id="tahapLbl"></b>
  </label>
  <label class="ctrl"><input id="ghost" type="checkbox" checked> Tampilkan rencana tahap berikutnya</label>
  <label class="ctrl"><input id="tanpaAtap" type="checkbox"> Sembunyikan atap (lihat void dari atas)</label>
</header>

<main>
  <section class="card">
    <h2>Denah 2D
      <span class="seg" id="lantaiSeg">
        <button data-lantai="1" class="on">Lantai 1</button><button data-lantai="2">Lantai 2</button>
      </span>
    </h2>
    <svg id="svg2d"></svg>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card">
    <h2>Model 3D</h2>
    <div id="view3d"></div>
    <div class="hint">Drag untuk memutar · scroll untuk zoom · klik kanan + drag untuk geser</div>
  </section>

  <section class="card full">
    <h2>Ringkasan per Tahap</h2>
    <table id="ringkasan"></table>
  </section>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// ================== DATA DENAH ==================
// Satuan meter. x ke kanan, y ke belakang (y=0 = sisi depan/jalan).
// jenis:
//   "ruang"   = berdinding penuh + atap
//   "terbuka" = hanya lantai (carport, taman)
//   "balkon"  = lantai + railing
//   "tangga"  = tangga; bentuk & anak tangganya dihitung oleh tanggaL()
//   "mezanin" = lantai atas di tepi void: railing di sisi yang menghadap void
//   "void"    = lubang tembus 2 lantai: tanpa pelat lantai, dinding luar + atap
// Opsional: mobil: n  -> gambar n mobil (cek muat/tidak)
const LAHAN = { w: 10, h: 12 };
const TINGGI_LANTAI = 3;

const TAHAP = {
  1: { nama: "Tahap 1 – Lantai 1",           warna: "#f4b860" },
  2: { nama: "Tahap 2 – Tangga + Lantai 2",  warna: "#86c77a" },
};

// Ukuran void di atas living room (ganti ke 3 untuk void 3×3)
const VOID = 4;
const LIV = { x: 4, y: 5.5, w: 6, h: 6.5 };  // living room
// void di pojok kanan-belakang living room; tangga L ada di dalamnya
const VOID_RECT = { x: LIV.x + LIV.w - VOID, y: LIV.y + LIV.h - VOID, w: VOID, h: VOID };

// Tangga L di dalam void: naik menyusuri dinding belakang (ke kanan),
// bordes di pojok kanan-belakang, lalu naik menyusuri dinding kanan (ke depan)
// dan tiba di selasar lantai 2 pada tepi depan void.
function tanggaL(v, lebar = 1, optrede = 0.175, antrede = 0.27) {
  const N = Math.round(TINGGI_LANTAI / optrede);  // jumlah optrede sampai lantai 2
  const naik = TINGGI_LANTAI / N;
  const bordes = { x: v.x + v.w - lebar, y: v.y + v.h - lebar, w: lebar, h: lebar };
  const len2 = bordes.y - v.y;
  const n2 = Math.max(1, Math.round(len2 / antrede)), d2 = len2 / n2;
  const n1 = Math.max(1, N - 2 - n2);
  const d1 = Math.min(antrede, (v.w - lebar) / n1);
  const x0 = bordes.x - n1 * d1;
  const anak = [];
  for (let i = 1; i <= n1; i++)
    anak.push({ x: x0 + (i - 1) * d1, y: bordes.y, w: d1, h: lebar, top: i * naik });
  anak.push({ ...bordes, top: (n1 + 1) * naik, bordes: true });
  for (let j = 1; j <= n2; j++)
    anak.push({ x: bordes.x, y: bordes.y - j * d2, w: lebar, h: d2, top: (n1 + 1 + j) * naik });
  const c = lebar / 2;
  return {
    anak, jumlah: N, naik,
    panah: [[x0 + 0.1, bordes.y + c], [bordes.x + c, bordes.y + c], [bordes.x + c, v.y + 0.1]],
  };
}

const RUANG = [
  // ---- Tahap 1, lantai 1 (full 10 × 12 m) ----
  { nama: "Carport (2 mobil)", x: 4, y: 0, w: 6, h: 5.5, lantai: 1, tahap: 1, jenis: "terbuka", mobil: 2 },
  { nama: "Studio",       x: 0, y: 0,   w: 4, h: 4.5, lantai: 1, tahap: 1, jenis: "ruang" },
  { nama: "Dapur",        x: 0, y: 4.5, w: 4, h: 5,   lantai: 1, tahap: 1, jenis: "ruang" },
  { nama: "Toilet",       x: 0, y: 9.5, w: 2, h: 2.5, lantai: 1, tahap: 1, jenis: "ruang" },
  { nama: "KM Kecil",     x: 2, y: 9.5, w: 2, h: 2.5, lantai: 1, tahap: 1, jenis: "ruang" },
  { nama: "Living Room",  ...LIV,                       lantai: 1, tahap: 1, jenis: "ruang", label: [6, 6.9] },

  // ---- Tahap 2: tangga L di void + lantai 2 full 10 × 12 m (usulan) ----
  { nama: "Tangga L",     ...VOID_RECT, lantai: 1, tahap: 2, jenis: "tangga", ...tanggaL(VOID_RECT) },
  { nama: "Void",         ...VOID_RECT, lantai: 2, tahap: 2, jenis: "void" },
  { nama: "Mezanin",      x: LIV.x, y: LIV.y, w: LIV.w - VOID, h: LIV.h, lantai: 2, tahap: 2, jenis: "mezanin" },
  { nama: "Selasar",      x: VOID_RECT.x, y: LIV.y, w: VOID, h: LIV.h - VOID, lantai: 2, tahap: 2, jenis: "mezanin" },
  { nama: "K. Tidur Utama", x: 0, y: 0,   w: 4, h: 4.5, lantai: 2, tahap: 2, jenis: "ruang" },
  { nama: "K. Tidur 2",   x: 0, y: 4.5, w: 4, h: 5,   lantai: 2, tahap: 2, jenis: "ruang" },
  { nama: "KM Atas",      x: 0, y: 9.5, w: 4, h: 2.5, lantai: 2, tahap: 2, jenis: "ruang" },
  // di atas carport (carport jadi beratap, ditopang kolom)
  { nama: "K. Tidur 3",   x: 4, y: 0,   w: 3, h: 5.5, lantai: 2, tahap: 2, jenis: "ruang" },
  { nama: "R. Santai",    x: 7, y: 0,   w: 3, h: 5.5, lantai: 2, tahap: 2, jenis: "ruang" },
].filter((r) => r.w > 0 && r.h > 0);

const BANGUNAN = ["ruang", "mezanin"];         // dihitung luas bangunan
const TIDAK_DIHITUNG = ["void", "tangga"];     // void bukan lantai; tangga di dalam ruang lain
const fmt = (n) => +n.toFixed(2);

// ================== STATE ==================
const $ = (id) => document.getElementById(id);
const state = { tahap: 1, lantai: 1, ghost: true, tanpaAtap: false };
const maxTahap = Math.max(...RUANG.map((r) => r.tahap));
$("tahap").max = maxTahap;

// ================== 2D (SVG) ==================
const PAD = 1;
const svg = $("svg2d");
svg.setAttribute("viewBox", `${-PAD} ${-PAD} ${LAHAN.w + PAD * 2} ${LAHAN.h + PAD * 2}`);

function render2D() {
  const out = [];
  // lahan + skala meter
  out.push(`<rect x="0" y="0" width="${LAHAN.w}" height="${LAHAN.h}" fill="#eef3e6" stroke="#9a9" stroke-width="0.05" stroke-dasharray="0.2 0.15"/>`);
  for (let i = 0; i <= LAHAN.w; i++)
    out.push(`<text x="${i}" y="-0.3" font-size="0.3" text-anchor="middle" fill="#999">${i}</text>`);
  for (let j = 0; j <= LAHAN.h; j++)
    out.push(`<text x="-0.3" y="${j + 0.1}" font-size="0.3" text-anchor="end" fill="#999">${j}</text>`);
  out.push(`<text x="${LAHAN.w / 2}" y="${LAHAN.h + 0.7}" font-size="0.35" text-anchor="middle" fill="#999">▲ Depan (jalan) di atas · lahan ${LAHAN.w} × ${LAHAN.h} m</text>`);

  // ruangan lantai lain yang sudah dibangun: siluet tipis sebagai acuan
  for (const r of RUANG) {
    if (r.lantai === state.lantai || r.tahap > state.tahap) continue;
    if (r.jenis === "tangga") {
      for (const a of r.anak) out.push(`<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="none" stroke="#bbb" stroke-width="0.02"/>`);
      continue;
    }
    out.push(`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="none" stroke="#bbb" stroke-width="0.04"/>`);
  }

  const lantaiIni = RUANG.filter((r) => r.lantai === state.lantai);
  // urutan gambar: tangga di atas ruangan yang menampungnya
  lantaiIni.sort((a, b) => (a.jenis === "tangga") - (b.jenis === "tangga"));
  for (const r of lantaiIni) {
    const built = r.tahap <= state.tahap;
    if (!built && !state.ghost) continue;
    const c = TAHAP[r.tahap].warna;
    const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    const rect = (extra) => `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" ${extra}/>`;
    if (r.jenis === "void") {
      out.push(rect(`fill="#fff" fill-opacity="${built ? 0.7 : 0.2}" stroke="${built ? "#333" : c}" stroke-width="0.05" stroke-dasharray="0.25 0.15"`));
      out.push(`<path d="M${r.x} ${r.y}L${r.x + r.w} ${r.y + r.h}M${r.x + r.w} ${r.y}L${r.x} ${r.y + r.h}" stroke="${built ? "#999" : c}" stroke-width="0.04"/>`);
    } else if (r.jenis === "tangga") {
      for (const a of r.anak)
        out.push(`<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" fill="${built ? (a.bordes ? "#eee" : "#fff") : c}" fill-opacity="${built ? 1 : 0.2}" stroke="${built ? "#555" : c}" stroke-width="0.03"/>`);
      out.push(`<polyline points="${r.panah.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${built ? "#c33" : c}" stroke-width="0.05" marker-end="url(#panah)"/>`);
    } else {
      const wall = r.jenis === "ruang" ? 0.15 : 0.06;
      const opa = r.jenis === "ruang" ? 0.85 : r.jenis === "mezanin" ? 0.6 : 0.4;
      out.push(built
        ? rect(`fill="${c}" fill-opacity="${opa}" stroke="#333" stroke-width="${wall}"`)
        : rect(`fill="${c}" fill-opacity="0.12" stroke="${c}" stroke-width="0.06" stroke-dasharray="0.25 0.15"`));
    }
    for (let i = 0; i < (built ? r.mobil || 0 : 0); i++) {
      const lebar = 1.8, panjang = 4.4, jarak = (r.w - lebar * r.mobil) / (r.mobil + 1);
      out.push(`<rect x="${r.x + jarak + i * (lebar + jarak)}" y="${r.y + 0.4}" width="${lebar}" height="${panjang}" rx="0.35" fill="#fff" stroke="#888" stroke-width="0.04"/>`);
    }
    const [lx, ty] = r.label || [cx, r.mobil ? r.y + r.h - 0.25 : cy];
    const fs = r.w < 2.5 ? 0.32 : 0.42;
    if (r.jenis === "tangga") {
      const [x0, y0] = r.panah[0];
      const teks = (y, t) => `<text x="${x0 - 0.2}" y="${y}" font-size="0.28" text-anchor="end" fill="${built ? "#c33" : "#888"}" paint-order="stroke" stroke="#fff" stroke-width="0.08">${t}</text>`;
      out.push(teks(y0 - 0.05, `${r.nama} ↑${built ? "" : " · T" + r.tahap}`));
      out.push(teks(y0 + 0.3, `${r.jumlah} × ${(r.naik * 100).toFixed(1)} cm`));
      continue;
    }
    out.push(`<text x="${lx}" y="${ty - 0.05}" font-size="${fs}" text-anchor="middle" fill="${built ? "#222" : "#888"}">${r.nama}</text>`);
    if (!r.mobil)
      out.push(`<text x="${lx}" y="${ty + fs + 0.05}" font-size="0.3" text-anchor="middle" fill="${built ? "#555" : "#aaa"}">${fmt(r.w)}×${fmt(r.h)} m${built ? "" : " · T" + r.tahap}</text>`);
  }
  // di lantai 1: tandai posisi void di atas
  if (state.lantai === 1)
    for (const v of RUANG.filter((r) => r.jenis === "void")) {
      out.push(`<rect x="${v.x + 0.1}" y="${v.y + 0.1}" width="${v.w - 0.2}" height="${v.h - 0.2}" fill="none" stroke="#555" stroke-width="0.04" stroke-dasharray="0.15 0.1"/>`);
      out.push(`<text x="${v.x + 0.25}" y="${v.y + 0.5}" font-size="0.28" fill="#555" paint-order="stroke" stroke="#fff" stroke-width="0.06">void ${v.w}×${v.h} m di atas</text>`);
    }
  svg.innerHTML = `<defs><marker id="panah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c33"/></marker></defs>` + out.join("");
}

$("legend").innerHTML = Object.entries(TAHAP)
  .map(([k, t]) => `<span style="--c:${t.warna}">${t.nama}</span>`).join("");

// ================== RINGKASAN ==================
function renderRingkasan() {
  let kum = 0;
  const rows = Object.entries(TAHAP).map(([k, t]) => {
    const rs = RUANG.filter((r) => r.tahap === +k);
    const luasOf = (f) => fmt(rs.filter(f).reduce((s, r) => s + r.w * r.h, 0));
    const luas = luasOf((r) => BANGUNAN.includes(r.jenis));
    const luasLain = luasOf((r) => !BANGUNAN.includes(r.jenis) && !TIDAK_DIHITUNG.includes(r.jenis));
    kum = fmt(kum + luas);
    return `<tr class="${+k > state.tahap ? "future" : ""}">
      <td><span style="color:${t.warna}">■</span> ${t.nama}</td>
      <td>${rs.map((r) => r.nama).join(", ")}</td>
      <td class="num">${luas} m²</td><td class="num">${luasLain} m²</td><td class="num">${kum} m²</td></tr>`;
  });
  $("ringkasan").innerHTML = `<tr><th>Tahap</th><th>Ruangan</th><th class="num">Luas bangunan</th>
    <th class="num">Carport/taman/balkon</th><th class="num">Kumulatif bangunan</th></tr>` + rows.join("");
}

// ================== 3D (THREE.JS) ==================
const host = $("view3d");
const scene = new THREE.Scene();
scene.background = new THREE.Color("#dfe9f1");

const camera = new THREE.PerspectiveCamera(45, 4 / 3, 0.1, 200);
camera.position.set(LAHAN.w / 2 + 9, 14, LAHAN.h + 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
host.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
Object.assign(labelRenderer.domElement.style, { position: "absolute", top: "0", left: "0", pointerEvents: "none" });
host.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(LAHAN.w / 2, 2, LAHAN.h / 2);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
window.denah3d = { camera, controls };  // untuk debug / screenshot dari console

scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa77, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(-8, 20, -12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15 });
sun.target.position.set(LAHAN.w / 2, 0, LAHAN.h / 2);
scene.add(sun, sun.target);

// tanah + lahan
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: "#b9cf9f" }));
ground.rotation.x = -Math.PI / 2;
ground.position.set(LAHAN.w / 2, -0.01, LAHAN.h / 2);
ground.receiveShadow = true;
scene.add(ground);
const lahanEdge = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(LAHAN.w, 0, LAHAN.h)),
  new THREE.LineBasicMaterial({ color: "#667" }));
lahanEdge.position.set(LAHAN.w / 2, 0.02, LAHAN.h / 2);
scene.add(lahanEdge);

// 2D (x, y) -> 3D (x, z). Depan lahan (y=0) menghadap kamera awal.
const Z = (y) => LAHAN.h - y;
const T = 0.15;          // tebal dinding
const TEBAL_PELAT = 0.12;

function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}

const overlap = (a, b) =>
  a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const sudahDibangun = (o) => o.tahap <= state.tahap;

// Railing dibuka di titik tangga tiba (anak tangga teratas menempel sisi ini)
function diUjungTangga(s, m) {
  return RUANG.some((t) => {
    if (t.jenis !== "tangga" || !sudahDibangun(t)) return false;
    const a = t.anak[t.anak.length - 1];
    return s.along === "x"
      ? m > a.x && m < a.x + a.w && (Math.abs(a.y - s.pos) < 1e-6 || Math.abs(a.y + a.h - s.pos) < 1e-6)
      : m > a.y && m < a.y + a.h && (Math.abs(a.x - s.pos) < 1e-6 || Math.abs(a.x + a.w - s.pos) < 1e-6);
  });
}

// Pecah tiap sisi ruangan jadi segmen: "wall", "rail", atau "none".
// Void & mezanin saling terbuka; mezanin diberi railing di sisi yang menghadap void.
function segmenSisi(r) {
  const terbukaKe = ["void", "mezanin"];
  const tetangga = RUANG.filter((o) => o !== r && o.lantai === r.lantai && sudahDibangun(o) && terbukaKe.includes(o.jenis));
  const sisi = [
    { nama: "depan",    along: "x", pos: r.y,       a: r.x, b: r.x + r.w },
    { nama: "belakang", along: "x", pos: r.y + r.h, a: r.x, b: r.x + r.w },
    { nama: "kiri",     along: "y", pos: r.x,       a: r.y, b: r.y + r.h },
    { nama: "kanan",    along: "y", pos: r.x + r.w, a: r.y, b: r.y + r.h },
  ];
  const STEP = 0.25, hasil = [];
  for (const s of sisi) {
    let cur = null;
    for (let t = s.a; t < s.b - 1e-6; t += STEP) {
      const m = t + STEP / 2;
      let kind = r.jenis === "balkon" ? "rail" : "wall";
      if (terbukaKe.includes(r.jenis)) {
        const n = tetangga.find((o) => s.along === "x"
          ? m > o.x && m < o.x + o.w && (Math.abs(o.y - s.pos) < 1e-6 || Math.abs(o.y + o.h - s.pos) < 1e-6)
          : m > o.y && m < o.y + o.h && (Math.abs(o.x - s.pos) < 1e-6 || Math.abs(o.x + o.w - s.pos) < 1e-6));
        if (n) kind = r.jenis === "mezanin" && n.jenis === "void" && !diUjungTangga(s, m) ? "rail" : "none";
      }
      if (cur && cur.kind === kind) cur.b = Math.min(t + STEP, s.b);
      else hasil.push(cur = { ...s, a: t, b: Math.min(t + STEP, s.b), kind });
    }
  }
  return hasil.filter((x) => x.kind !== "none");
}

function buatMobil(x, y) {
  const g = new THREE.Group();
  const bodi = box(1.8, 0.8, 4.4, new THREE.MeshStandardMaterial({ color: "#f2f2f2" }));
  bodi.position.set(0, 0.55, 0);
  const kabin = box(1.6, 0.6, 2.2, new THREE.MeshStandardMaterial({ color: "#445" }));
  kabin.position.set(0, 1.25, 0.2);
  g.add(bodi, kabin);
  g.position.set(x, 0, Z(y));
  return g;
}

function buatRuang(r) {
  const g = new THREE.Group();
  const base = (r.lantai - 1) * TINGGI_LANTAI;
  const warna = new THREE.Color(TAHAP[r.tahap].warna);
  const matLantai = new THREE.MeshStandardMaterial({ color: warna.clone().lerp(new THREE.Color("#fff"), 0.3) });
  const matDinding = new THREE.MeshStandardMaterial({ color: warna, transparent: true, opacity: 1 });
  const cx = r.x + r.w / 2, cz = Z(r.y + r.h / 2);

  if (r.jenis === "tangga") {
    for (const a of r.anak) {
      const st = box(a.w, a.top, a.h, a.bordes ? matDinding : matLantai);
      st.position.set(a.x + a.w / 2, a.top / 2, Z(a.y + a.h / 2));
      g.add(st);
    }
  } else if (r.jenis !== "void") {
    const pelat = box(r.w, TEBAL_PELAT, r.h, matLantai);
    pelat.position.set(cx, base + TEBAL_PELAT / 2, cz);
    g.add(pelat);
  }

  const tinggiDinding = TINGGI_LANTAI - TEBAL_PELAT;
  const berdinding = ["ruang", "balkon", "mezanin", "void"].includes(r.jenis);
  if (berdinding) {
    for (const s of segmenSisi(r)) {
      const tinggi = s.kind === "rail" ? 1 : tinggiDinding;
      const tebal = s.kind === "rail" ? 0.06 : T;
      const len = s.b - s.a, mid = (s.a + s.b) / 2;
      const off = s.nama === "depan" || s.nama === "kiri" ? tebal / 2 : -tebal / 2;
      const w = s.along === "x" ? box(len, tinggi, tebal, matDinding) : box(tebal, tinggi, len, matDinding);
      const y = base + TEBAL_PELAT + tinggi / 2;
      if (s.along === "x") w.position.set(mid, y, Z(s.pos + off));
      else w.position.set(s.pos + off, y, Z(mid));
      g.add(w);
    }
  }

  // atap datar tipis jika tidak tertutup lantai di atasnya
  const diAtas = RUANG.filter((o) => o.lantai === r.lantai + 1 && sudahDibangun(o) && overlap(o, r));
  // area terbuka (carport) yang tertutup lantai atas: tambahkan kolom di pojok
  if (r.jenis === "terbuka" && diAtas.length) {
    const K = 0.3, matKolom = new THREE.MeshStandardMaterial({ color: "#ccc" });
    for (const [kx, ky] of [[r.x, r.y], [r.x + r.w - K, r.y], [r.x, r.y + r.h - K], [r.x + r.w - K, r.y + r.h - K]]) {
      const k = box(K, TINGGI_LANTAI, K, matKolom);
      k.position.set(kx + K / 2, base + TINGGI_LANTAI / 2, Z(ky + K / 2));
      g.add(k);
    }
  }
  if (["ruang", "mezanin", "void"].includes(r.jenis) && diAtas.length === 0 && !state.tanpaAtap) {
    const atap = box(r.w + 0.3, 0.1, r.h + 0.3, new THREE.MeshStandardMaterial({ color: "#8a6f5a" }));
    atap.position.set(cx, base + TINGGI_LANTAI + 0.05, cz);
    g.add(atap);
  }

  if (r.mobil && sudahDibangun(r)) {
    const jarak = (r.w - 1.8 * r.mobil) / (r.mobil + 1);
    for (let i = 0; i < r.mobil; i++)
      g.add(buatMobil(r.x + jarak + 0.9 + i * (1.8 + jarak), r.y + 0.4 + 2.2));
  }

  // label hanya untuk ruangan yang terlihat paling atas, supaya tidak menumpuk
  if (diAtas.length || r.jenis === "tangga") return g;
  const el = document.createElement("div");
  el.className = "label3d";
  el.textContent = r.nama;
  const label = new CSS2DObject(el);
  const tinggiLabel = r.jenis === "terbuka" ? 0.3 : TINGGI_LANTAI;
  label.position.set(cx, base + tinggiLabel + 0.4, cz);
  g.add(label);
  return g;
}

function jadikanGhost(g) {
  g.traverse((o) => {
    if (o.isMesh) {
      o.material = new THREE.MeshBasicMaterial({ color: o.material.color, transparent: true, opacity: 0.15, depthWrite: false });
      o.castShadow = false;
      const edge = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry),
        new THREE.LineBasicMaterial({ color: o.material.color, transparent: true, opacity: 0.6 }));
      o.add(edge);
    }
    if (o.isCSS2DObject) o.element.style.opacity = 0.45;
  });
}

const rumah = new THREE.Group();
scene.add(rumah);
let animasi = [];     // { group, start } — ruangan baru "tumbuh" dari tanah
let tahapSebelumnya = 0;

function render3D() {
  rumah.traverse((o) => o.isCSS2DObject && o.element.remove());
  rumah.clear();
  animasi = [];
  for (const r of RUANG) {
    const built = r.tahap <= state.tahap;
    if (!built && !state.ghost) continue;
    const g = buatRuang(r);
    if (!built) jadikanGhost(g);
    else if (r.tahap > tahapSebelumnya) {
      g.userData.base = (r.lantai - 1) * TINGGI_LANTAI;
      animasi.push({ group: g, start: performance.now() });
    }
    rumah.add(g);
  }
  tahapSebelumnya = state.tahap;
}

function tumbuh(now) {
  for (const a of animasi) {
    const t = Math.min((now - a.start) / 700, 1);
    const e = 1 - Math.pow(1 - t, 3);
    a.group.scale.y = Math.max(e, 0.001);
    a.group.position.y = a.group.userData.base * (1 - e);
  }
  animasi = animasi.filter((a) => a.group.scale.y < 1);
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}
new ResizeObserver(resize).observe(host);

renderer.setAnimationLoop((now) => {
  tumbuh(now);
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

// ================== KONTROL ==================
function renderSemua() {
  $("tahapLbl").textContent = TAHAP[state.tahap].nama;
  render2D();
  render3D();
  renderRingkasan();
}
$("tahap").oninput = (e) => { state.tahap = +e.target.value; renderSemua(); };
$("ghost").onchange = (e) => { state.ghost = e.target.checked; renderSemua(); };
$("tanpaAtap").onchange = (e) => {
  state.tanpaAtap = e.target.checked;
  tahapSebelumnya = state.tahap;
  // tanpa atap: kamera lebih tinggi supaya bisa melihat ke dalam void
  if (state.tanpaAtap) camera.position.set(LAHAN.w / 2 + 4, 20, LAHAN.h + 7);
  else camera.position.set(LAHAN.w / 2 + 9, 14, LAHAN.h + 12);
  render3D();
};
$("lantaiSeg").onclick = (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  state.lantai = +b.dataset.lantai;
  for (const x of $("lantaiSeg").children) x.classList.toggle("on", x === b);
  render2D();
};
renderSemua();
</script>
</body>
